# ---- App ----
# REQUIRED: set the APP_API_KEY environment variable (app fails to start without it)
app.api-key=${APP_API_KEY}
app.mode=real
app.python-service-url=http://127.0.0.1:8001
app.timeout-minutes=4
app.python-script-path=${ANALYZE_SCRIPT:../scripts/analyze.py}
app.python-command=${PYTHON_CMD:auto}
app.job-ttl-hours=24
app.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:4173

# ---- Uploads (default is only 1MB!) ----
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# ---- SQLite ----
spring.datasource.url=jdbc:sqlite:jobs.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite allows one writer; a single connection avoids "database is locked"
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false